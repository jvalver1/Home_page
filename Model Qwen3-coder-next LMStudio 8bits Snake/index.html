<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Snake Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #202020;
            --screen-bg: #000000;
            --snake-color: #33ff33; /* Retro Terminal Green */
            --food-color: #ff3333;  /* Retro Red */
            --text-color: #eeeeee;
            --border-color: #555;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            text-shadow: 4px 4px #000;
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--snake-color);
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .game-container {
            position: relative;
            border: 10px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: var(--screen-bg);
            display: block;
            cursor: none; /* Hide mouse over game */
        }

        /* CRT Scanline Effect Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .score-box span {
            color: var(--snake-color);
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            width: 100%;
        }

        .btn {
            background: var(--snake-color);
            color: black;
            font-family: 'Press Start 2P', cursive;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: 4px solid white;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #ccffcc;
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
        
        .key {
            border: 1px solid #777;
            padding: 4px 8px;
            border-radius: 4px;
            background: #333;
            color: white;
        }

    </style>
</head>
<body>

    <h1>Snake 8-Bit</h1>

    <div class="ui-panel">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="score-box">HIGH SCORE: <span id="highScore">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="scanlines"></div>
        
        <div id="overlay">
            <h2 style="color: white; margin-bottom: 20px;">READY?</h2>
            <button class="btn" onclick="startGame()">INSERT COIN (START)</button>
            <p style="font-size: 10px; color: #888; margin-top: 15px;">Turn volume up for 8-bit sounds!</p>
        </div>
    </div>

    <div class="controls-hint">
        Use <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> to Move<br>
        Press <span class="key">SPACE</span> to Pause
    </div>

<script>
    // --- AUDIO SYSTEM (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'start') {
            // 8-Bit Startup Sequence
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);

        } else if (type === 'move') {
            // Very faint click
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, now);
            gainNode.gain.setValueAtTime(0.03, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);

        } else if (type === 'eat') {
            // High pitched "coin" sound
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);

        } else if (type === 'die') {
            // Low crash sound
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.5);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // --- GAME CONSTANTS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');

    const GRID_SIZE = 20;
    const TILE_COUNT_X = canvas.width / GRID_SIZE;
    const TILE_COUNT_Y = canvas.height / GRID_SIZE;

    // Game State
    let snake = [];
    let food = {x: 15, y: 15};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameInterval;
    let isPaused = false;
    let isGameRunning = false;
    
    // Input buffering to prevent self-collision on quick turns
    let lastProcessedDirection = {x: 0, y: 0}; 

    highScoreEl.innerText = highScore;

    // --- GAME LOGIC ---

    function startGame() {
        initAudio();
        playSound('start');
        
        // Reset State
        snake = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];
        dx = 1; // Start moving right
        dy = 0;
        score = 0;
        scoreEl.innerText = score;
        isPaused = false;
        isGameRunning = true;
        overlay.classList.add('hidden');
        
        spawnFood();

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 100); // 10 FPS for retro feel
    }

    function gameOver() {
        playSound('die');
        clearInterval(gameInterval);
        isGameRunning = false;
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.innerText = highScore;
            alert("NEW HIGH SCORE! " + score);
        } else {
            alert("GAME OVER\nScore: " + score);
        }
        
        overlay.innerHTML = `<h2 style="color:red">GAME OVER</h2><button class="btn" onclick="startGame()">RETRY</button>`;
        overlay.classList.remove('hidden');
    }

    function spawnFood() {
        // Random position
        food.x = Math.floor(Math.random() * TILE_COUNT_X);
        food.y = Math.floor(Math.random() * TILE_COUNT_Y);

        // Don't spawn food on snake body
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                spawnFood();
                break;
            }
        }
    }

    function gameLoop() {
        if (isPaused) return;

        moveSnake();
        
        if (checkCollisions()) {
            gameOver();
            return;
        }
        
        draw();
    }

    function moveSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);

        // Check if ate food
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            playSound('eat');
            spawnFood();
            // Don't pop the tail, so it grows
        } else {
            snake.pop(); // Remove tail
        }
        
        lastProcessedDirection = {x: dx, y: dy};
    }

    function checkCollisions() {
        const head = snake[0];

        // Wall Collision
        if (head.x < 0 || head.x >= TILE_COUNT_X || head.y < 0 || head.y >= TILE_COUNT_Y) {
            return true;
        }

        // Self Collision
        for (let i = 1; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                return true;
            }
        }

        return false;
    }

    function draw() {
        // Clear Screen
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid (Subtle retro grid effect)
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        for(let x=0; x<canvas.width; x+=GRID_SIZE) {
            ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y=0; y<canvas.height; y+=GRID_SIZE) {
            ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Draw Food (Pixelated Apple)
        ctx.fillStyle = '#ff3333';
        // Make food a little smaller than the tile to look like pixels
        const padding = 2;
        ctx.fillRect(food.x * GRID_SIZE + padding, food.y * GRID_SIZE + padding, GRID_SIZE - (padding*2), GRID_SIZE - (padding*2));
        
        // Draw Snake
        snake.forEach((part, index) => {
            // Head is a brighter green, body is darker
            if (index === 0) {
                ctx.fillStyle = '#ccffcc'; 
            } else {
                ctx.fillStyle = '#33ff33';
            }
            
            ctx.fillRect(part.x * GRID_SIZE + padding, part.y * GRID_SIZE + padding, GRID_SIZE - (padding*2), GRID_SIZE - (padding*2));
            
            // Eyes for the head
            if (index === 0) {
                ctx.fillStyle = 'black';
                const eyeSize = 4;
                // Simple logic to position eyes based on direction would be complex, 
                // so we just put two dots in the center for a generic look
                ctx.fillRect(part.x * GRID_SIZE + 6, part.y * GRID_SIZE + 6, eyeSize, eyeSize);
                ctx.fillRect(part.x * GRID_SIZE + 14, part.y * GRID_SIZE + 6, eyeSize, eyeSize);
            }
        });
        
        // Draw Score inside canvas (optional aesthetic)
        ctx.fillStyle = '#555';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText("SCORE: " + score, 10, canvas.height - 10);
    }

    // --- INPUT HANDLING ---
    document.addEventListener('keydown', changeDirection);

    function changeDirection(event) {
        if (!isGameRunning && event.code === 'Space') {
             // Allow space to start if overlay is hidden (pause)
             if(isPaused) {
                 isPaused = false;
                 overlay.classList.add('hidden');
             } else if (snake.length > 0) {
                 isPaused = true;
                 ctx.fillStyle = "rgba(0,0,0,0.5)";
                 ctx.fillRect(0,0,canvas.width, canvas.height);
                 ctx.fillStyle = "white";
                 ctx.font = "30px 'Press Start 2P'";
                 ctx.textAlign = "center";
                 ctx.fillText("PAUSED", canvas.width/2, canvas.height/2);
             }
             return;
        }

        const LEFT_KEY = 37;
        const RIGHT_KEY = 39;
        const UP_KEY = 38;
        const DOWN_KEY = 40;

        const keyPressed = event.keyCode;
        
        // Prevent reversing directly into self
        const goingUp = lastProcessedDirection.y === -1;
        const goingDown = lastProcessedDirection.y === 1;
        const goingRight = lastProcessedDirection.x === 1;
        const goingLeft = lastProcessedDirection.x === -1;

        if (keyPressed === LEFT_KEY && !goingRight) {
            dx = -1; dy = 0;
            playSound('move');
        }
        if (keyPressed === UP_KEY && !goingDown) {
            dx = 0; dy = -1;
            playSound('move');
        }
        if (keyPressed === RIGHT_KEY && !goingLeft) {
            dx = 1; dy = 0;
            playSound('move');
        }
        if (keyPressed === DOWN_KEY && !goingUp) {
            dx = 0; dy = 1;
            playSound('move');
        }
    }

    // Initial Draw
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

</script>
</body>
</html>
