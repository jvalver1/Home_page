<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyes de Bélgica - Monarchia</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="nav-btn"><span>⬅</span> Menú</a>
        <div class="app-title">BÉLGICA</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Monarquía Belga</h1>
            <p id="pageSub">Reino de Bélgica (1831-Presente)</p>
        </div>
        <div class="timeline-container" id="timeline"></div>
    </div>

    <script>
        const DB = [
            // INDEPENDENCIA
            { type: 'gap', title: {es:"Revolución Belga", en:"Belgian Revolution"}, desc: {es:"1830: Independencia de los Países Bajos", en:"1830: Independence from Netherlands"}, y:"1830" },

            // SAJONIA
            { type: 'king', n: "Leopoldo I", y: "1831-1865", d: "Sajonia", c: "d-black", i: "lion", born: "Coburgo", died: "75", succ: "Leopoldo II", facts: {es:["Primer Rey de los Belgas", "Tío de la Reina Victoria de UK", "Primera línea férrea continental"], en:["First King of the Belgians", "Uncle of Queen Victoria", "First continental railway"]} },
            { type: 'king', n: "Leopoldo II", y: "1865-1909", d: "Sajonia", c: "d-black", i: "lion", born: "Bruselas", died: "74", succ: "Alberto I", facts: {es:["El Rey Constructor", "Estado Libre del Congo (Colonización brutal)", "Embelleció Bruselas"], en:["The Builder King", "Congo Free State", "Embellished Brussels"]} },
            { type: 'king', n: "Alberto I", y: "1909-1934", d: "Sajonia", c: "d-black", i: "lion", born: "Bruselas", died: "58", succ: "Leopoldo III", facts: {es:["El Rey Soldado (I Guerra Mundial)", "Lideró el ejército desde el frente", "Murió escalando una montaña"], en:["The Soldier King (WWI)", "Led army from front", "Died climbing a mountain"]} },
            { type: 'king', n: "Leopoldo III", y: "1934-1951", d: "Sajonia", c: "d-black", i: "lion", born: "Bruselas", died: "81", succ: "Balduino", facts: {es:["Rendición en la II Guerra Mundial", "Cuestión Real (Referéndum sobre su retorno)", "Abdicó por la unidad del país"], en:["Surrender in WWII", "Royal Question (exile)", "Abdicated for unity"]} },
            { type: 'king', n: "Balduino", y: "1951-1993", d: "Sajonia", c: "d-black", i: "lion", born: "Bruselas", died: "62", succ: "Alberto II", facts: {es:["Rey muy católico", "Independencia del Congo (1960)", "Federalización de Bélgica", "Abdicó por un día (Ley del aborto)"], en:["Devout Catholic", "Congo Independence", "Federalization", "Abdicated for one day (Abortion law)"]} },
            { type: 'king', n: "Alberto II", y: "1993-2013", d: "Sajonia", c: "d-black", i: "lion", born: "Bruselas", died: "-", succ: "Felipe", facts: {es:["Ascendió tras la muerte de su hermano", "Crisis política (541 días sin gobierno)", "Abdicó por salud"], en:["Succeeded brother", "Political crisis", "Abdicated due to health"]} },
            { type: 'king', n: "Felipe", y: "2013-Pte", d: "Sajonia", c: "d-black", i: "lion", born: "Bruselas", died: "-", succ: "Isabel", facts: {es:["Rey actual", "Formación militar y académica", "Mantiene la unidad valona/flamenca"], en:["Current King", "Military/Academic training", "Unity figure"]} }
        ];

        function getSVG(t) {
            const c = {k:"#2c3e50", y:"#f1c40f", r:"#e74c3c"};
            let p = '';
            // León Belga (Amarillo sobre negro)
            if(t==='lion') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.k}" stroke="${c.r}"/><circle cx="50" cy="40" r="15" fill="${c.y}"/>`;
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const labels = { es: { born:"Nace", died:"Muere", succ:"Sucesor" }, en: { born:"Born", died:"Died", succ:"Successor" } }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `<div class="gap-title">${item.title[lang]}</div><div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>${getSVG('gap')}<div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>`;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `<div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div><div class="card-header"><div class="monarch-name">${item.n}</div>${getSVG(item.i)}</div><div class="years">${item.y}</div><div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div><div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div><div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div><div class="events-box"><ul class="events-list">${facts}</ul></div>`;
                }
                container.appendChild(card);
            });
        }
        renderTimeline();
    </script>
</body>
</html>
