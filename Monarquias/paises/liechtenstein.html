<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Príncipes de Liechtenstein - Monarchia</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="nav-btn"><span>⬅</span> Menú</a>
        <div class="app-title">LIECHTENSTEIN</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Casa de Liechtenstein</h1>
            <p id="pageSub">De Feudo Imperial a Estado Soberano</p>
        </div>
        <div class="timeline-container" id="timeline"></div>
    </div>

    <script>
        const DB = [
            // FUNDACIÓN
            { type: 'king', n: "Carlos I", y: "1608-1627", d: "Liechtenstein", c: "d-blue", i: "eagle", born: "Feldsberg", died: "57", succ: "Carlos Eusebio", facts: {es:["Primer Príncipe de Liechtenstein", "Nombrado por el Emperador Matías", "Gran político en la corte de Viena"], en:["First Prince of Liechtenstein", "Appointed by Emperor Matthias", "Statesman in Vienna"]} },
            { type: 'king', n: "Juan Adán I", y: "1684-1712", d: "Liechtenstein", c: "d-blue", i: "eagle", born: "Brno", died: "54", succ: "José Venceslao", facts: {es:["'El Rico'", "Compró el Señorío de Schellenberg (1699)", "Compró el Condado de Vaduz (1712)"], en:["'The Rich'", "Bought Schellenberg", "Bought Vaduz"]} },
            
            // ELEVACIÓN A PRINCIPADO IMPERIAL
            { type: 'gap', title: {es:"Principado Imperial", en:"Imperial Principality"}, desc: {es:"1719: Carlos VI une Vaduz y Schellenberg", en:"1719: Charles VI unites Vaduz & Schellenberg"}, y:"1719" },

            { type: 'king', n: "José Venceslao", y: "1748-1772", d: "Liechtenstein", c: "d-blue", i: "eagle", born: "Praga", died: "75", succ: "Francisco José I", facts: {es:["Gran estratega militar", "Reorganizó la artillería austríaca", "Diplomático en París"], en:["Great military strategist", "Reorganized Austrian artillery", "Diplomat in Paris"]} },
            { type: 'king', n: "Juan I José", y: "1805-1836", d: "Liechtenstein", c: "d-blue", i: "eagle", born: "Viena", died: "75", succ: "Luis II", facts: {es:["Comandante en Guerras Napoleónicas", "Obtuvo soberanía plena (1806)", "Ingresó en la Confederación del Rin"], en:["Commander in Napoleonic Wars", "Gained full sovereignty (1806)", "Joined Confed. of the Rhine"]} },
            { type: 'king', n: "Juan II", y: "1858-1929", d: "Liechtenstein", c: "d-blue", i: "eagle", born: "Eisgrub", died: "88", succ: "Francisco I", facts: {es:["El Bueno", "Reinado de 70 años", "Abolió el ejército (1868)", "Primera Constitución"], en:["The Good", "70-year reign", "Abolished army (1868)", "First Constitution"]} },

            // ERA MODERNA
            { type: 'king', n: "Francisco José II", y: "1938-1989", d: "Liechtenstein", c: "d-blue", i: "crown", born: "Estiria", died: "83", succ: "Juan Adán II", facts: {es:["Neutralidad en la II Guerra Mundial", "Primer príncipe en vivir permanentemente en Vaduz", "Modernizó la economía"], en:["Neutrality in WWII", "First prince to live in Vaduz", "Modernized economy"]} },
            { type: 'king', n: "Juan Adán II", y: "1989-Pte", d: "Liechtenstein", c: "d-blue", i: "crown", born: "Zúrich", died: "-", succ: "Luis (Regente)", facts: {es:["Amplió poderes del Príncipe (ref. 2003)", "Ingreso en la ONU (1990)", "Cedió funciones a su hijo Alois (2004)"], en:["Expanded princely powers", "Joined UN", "Handed power to son Alois"]} }
        ];

        function getSVG(t) {
            const c = {b:"#2980b9", r:"#e74c3c", g:"#f1c40f", k:"#2c3e50"};
            let p = '';
            // Escudo simple (bicolor azul/rojo con corona)
            if(t==='crown') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.b}" stroke="${c.k}"/><rect x="20" y="35" width="60" height="25" fill="${c.r}"/><path d="M30 15 l10 10 h20 l10 -10 l-10 5 l-10 -5 l-10 5 z" fill="${c.g}"/>`;
            // Águila Imperial (por su pasado en el Sacro Imperio)
            if(t==='eagle') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.g}" stroke="${c.k}"/><path d="M30 30 h40 v20 h-40 z" fill="${c.k}"/>`;
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const labels = { es: { born:"Nace", died:"Muere", succ:"Sucesor" }, en: { born:"Born", died:"Died", succ:"Successor" } }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `<div class="gap-title">${item.title[lang]}</div><div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>${getSVG('gap')}<div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>`;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `<div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div><div class="card-header"><div class="monarch-name">${item.n}</div>${getSVG(item.i)}</div><div class="years">${item.y}</div><div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div><div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div><div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div><div class="events-box"><ul class="events-list">${facts}</ul></div>`;
                }
                container.appendChild(card);
            });
        }
        renderTimeline();
    </script>
</body>
</html>
