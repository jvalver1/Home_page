<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Príncipes de Mónaco - Monarchia</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="nav-btn"><span>⬅</span> Menú</a>
        <div class="app-title">MÓNACO</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Principado de Mónaco</h1>
            <p id="pageSub">La Dinastía Grimaldi (1297-Presente)</p>
        </div>
        <div class="timeline-container" id="timeline"></div>
    </div>

    <script>
        const DB = [
            // ORIGEN
            { type: 'king', n: "Francisco Grimaldi (Malizia)", y: "1297-1309", d: "Grimaldi", c: "d-red", i: "diamond", born: "Génova", died: "1309", succ: "Rainiero I", facts: {es:["Tomó la fortaleza disfrazado de monje", "Fundador de la dinastía", "Expulsado por los genoveses (luego regresaron)"], en:["Captured fortress disguised as monk", "Founder of dynasty", "Expelled by Genoese"]} },
            
            // SEÑORES DE MÓNACO
            { type: 'gap', title: {es:"Señorío de Mónaco", en:"Lordship of Monaco"}, desc: {es:"Lucha por la independencia (Génova/Francia)", en:"Struggle for independence"}, y:"1309-1612" },
            { type: 'king', n: "Honorato I", y: "1523-1581", d: "Grimaldi", c: "d-red", i: "diamond", born: "Mónaco", died: "58", succ: "Carlos II", facts: {es:["Alianza con España (Carlos V)", "Modernizó la fortaleza"], en:["Alliance with Spain", "Modernized fortress"]} },

            // PRÍNCIPES SOBERANOS
            { type: 'king', n: "Honorato II", y: "1604-1662", d: "Grimaldi", c: "d-red", i: "crown", born: "Mónaco", died: "64", succ: "Luis I", facts: {es:["Primer 'Príncipe' Soberano", "Tratado de Péronne (Protección francesa)", "Construcción del Palacio"], en:["First Sovereign 'Prince'", "Treaty of Péronne", "Built the Palace"]} },
            { type: 'king', n: "Luis I", y: "1662-1701", d: "Grimaldi", c: "d-red", i: "crown", born: "Mónaco", died: "58", succ: "Antonio I", facts: {es:["Embajador ante el Vaticano", "Estableció el Código Legal (Código Luis)"], en:["Ambassador to Vatican", "Established Code Louis"]} },

            // REVOLUCIÓN FRANCESA
            { type: 'gap', title: {es:"Anexión a Francia", en:"French Annexation"}, desc: {es:"1793-1814 (Revolución Francesa)", en:"1793-1814 (French Revolution)"}, y:"1793-1814" },

            // RESTAURACIÓN Y AUGE
            { type: 'king', n: "Carlos III", y: "1856-1889", d: "Grimaldi", c: "d-red", i: "crown", born: "París", died: "70", succ: "Alberto I", facts: {es:["Fundó el Casino de Montecarlo", "Abolió los impuestos directos", "Perdió Menton y Roquebrune"], en:["Founded Monte Carlo Casino", "Abolished direct taxes", "Lost Menton & Roquebrune"]} },
            { type: 'king', n: "Alberto I", y: "1889-1922", d: "Grimaldi", c: "d-red", i: "crown", born: "París", died: "73", succ: "Luis II", facts: {es:["El Príncipe Navegante", "Científico y oceanógrafo", "Fundó el Museo Oceanográfico"], en:["The Navigator Prince", "Scientist/Oceanographer", "Founded Oceanographic Museum"]} },
            { type: 'king', n: "Luis II", y: "1922-1949", d: "Grimaldi", c: "d-red", i: "crown", born: "Baden", died: "78", succ: "Rainiero III", facts: {es:["El Príncipe Soldado", "Sirvió en el ejército francés (I GM)", "Mónaco ocupado en II GM"], en:["The Soldier Prince", "Served in French Army", "Monaco occupied in WWII"]} },
            { type: 'king', n: "Rainiero III", y: "1949-2005", d: "Grimaldi", c: "d-red", i: "crown", born: "Mónaco", died: "81", succ: "Alberto II", facts: {es:["El Príncipe Constructor", "Casado con Grace Kelly", "Transformación económica moderna"], en:["The Builder Prince", "Married Grace Kelly", "Modern economic transformation"]} },
            { type: 'king', n: "Alberto II", y: "2005-Pte", d: "Grimaldi", c: "d-red", i: "crown", born: "Mónaco", died: "-", succ: "Jaime", facts: {es:["Príncipe actual", "Defensor del medio ambiente", "Miembro del COI (Olímpico)"], en:["Current Prince", "Environmental advocate", "IOC Member"]} }
        ];

        function getSVG(t) {
            const c = {r:"#e74c3c", w:"#fff", g:"#f1c40f"};
            let p = '';
            // Rombos Grimaldi (Simplificado)
            if(t==='diamond') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.w}" stroke="${c.r}"/><rect x="35" y="25" width="30" height="30" fill="${c.r}" transform="rotate(45 50 40)"/>`;
            // Corona
            if(t==='crown') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.w}" stroke="${c.r}"/><path d="M30 40 l10 15 h20 l10 -15 l-10 5 l-10 -10 l-10 10 z" fill="${c.g}"/>`;
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const labels = { es: { born:"Nace", died:"Muere", succ:"Sucesor" }, en: { born:"Born", died:"Died", succ:"Successor" } }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `<div class="gap-title">${item.title[lang]}</div><div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>${getSVG('gap')}<div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>`;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `<div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div><div class="card-header"><div class="monarch-name">${item.n}</div>${getSVG(item.i)}</div><div class="years">${item.y}</div><div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div><div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div><div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div><div class="events-box"><ul class="events-list">${facts}</ul></div>`;
                }
                container.appendChild(card);
            });
        }
        renderTimeline();
    </script>
</body>
</html>
