<body>
    
    <div class="top-bar">
        <a href="../index.html" class="nav-btn">
            <span>⬅</span> Menú Principal

        <div class="app-title">FRANCIA</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Monarquía Francesa</h1>
            <p id="pageSub">De Carlomagno a Napoleón III</p>
        </div>

        <div class="timeline-container" id="timeline">
            </div>
    </div>

            { type: 'king', n: "Hugo Capeto", y: "987-996", d: "Capeto", c: "d-blue", i: "fleur", born: "París", died: "55", succ: "Roberto II", facts: {es:["Fundador de la dinastía", "Elegido por los nobles", "Poder limitado a Île-de-France"], en:["Founder of the dynasty", "Elected by nobles", "Power limited to Île-de-France"]} },

            { type: 'king', n: "Enrique III", y: "1574-1589", d: "Valois", c: "d-blue", i: "fleur", born: "Fontainebleau", died: "37", succ: "Enrique IV", facts: {es:["Último Valois", "Guerras de Religión", "Asesinado por un monje"], en:["Last Valois", "Wars of Religion", "Assassinated by a monk"]} },

        ];

        // --- FUNCIONES DE RENDERIZADO ---
        function getSVG(t) {
            const c = {r:"#e74c3c", y:"#f1c40f", b:"#2980b9", w:"#ffffff", k:"#2c3e50", g:"#27ae60"};
            const shield = 'd="M20 10 h60 v50 a30 30 0 0 1 -60 0 z"';
            let p = '';
            
            // Iconos Francia
            if(t==='fleur') p=`<path ${shield} fill="${c.b}" stroke="${c.k}"/><circle cx="50" cy="30" r="5" fill="${c.y}"/><circle cx="40" cy="50" r="5" fill="${c.y}"/><circle cx="60" cy="50" r="5" fill="${c.y}"/>`; // Flor de Lis
            if(t==='eagle') p=`<path ${shield} fill="${c.r}" stroke="${c.k}"/><path d="M30 35 h40 v20 h-40 z" fill="${c.y}"/>`; // Águila Imperial
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';

            const labels = {
                es: { born:"Nace", died:"Muere", succ:"Sucesor" },
                en: { born:"Born", died:"Died", succ:"Successor" }
            }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `
                        <div class="gap-title">${item.title[lang]}</div>
                        <div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>
                        ${getSVG('gap')}
                        <div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>
                    `;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `
                        <div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div>
                        <div class="card-header">
                            <div class="monarch-name">${item.n}</div>
                            ${getSVG(item.i)}
                        </div>
                        <div class="years">${item.y}</div>
                        
                        <div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div>
                        <div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div>
                        <div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div>

                        <div class="events-box">
                            <ul class="events-list">${facts}</ul>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        renderTimeline();
    </script>
</body>
</html>
