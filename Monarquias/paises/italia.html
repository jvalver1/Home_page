<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyes de Italia - Monarchia</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    
    <div class="top-bar">
        <a href="../index.html" class="nav-btn">
            <span>⬅</span> Menú Principal
        </a>
        <div class="app-title">ITALIA</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Monarquía Italiana</h1>
            <p id="pageSub">Casa de Saboya y la Unificación</p>
        </div>

        <div class="timeline-container" id="timeline"></div>
    </div>

    <script>
        // --- BASE DE DATOS ITALIA ---
        const DB = [
            // FRAGMENTACIÓN
            { type: 'gap', title: {es:"Estados Pre-Unitarios", en:"Pre-Unitary States"}, desc: {es:"Caída de Roma (476) hasta el Risorgimento (1861)", en:"Fall of Rome (476) to Risorgimento (1861)"}, y:"476-1861" },
            
            // REINO DE ITALIA (SABOYA)
            { type: 'king', n: "Víctor Manuel II", y: "1861-1878", d: "Saboya", c: "d-green", i: "cross", born: "Turín", died: "57", succ: "Humberto I", facts: {es:["Padre de la Patria", "Primer Rey de Italia Unida", "Conquista de Roma (1870)"], en:["Father of the Fatherland", "First King of United Italy", "Capture of Rome (1870)"]} },
            { type: 'king', n: "Humberto I", y: "1878-1900", d: "Saboya", c: "d-green", i: "cross", born: "Turín", died: "56", succ: "Víctor Manuel III", facts: {es:["El Rey Bueno", "Triple Alianza (Alemania/Austria)", "Asesinado por un anarquista en Monza"], en:["The Good King", "Triple Alliance", "Assassinated by anarchist in Monza"]} },
            { type: 'king', n: "Víctor Manuel III", y: "1900-1946", d: "Saboya", c: "d-green", i: "cross", born: "Nápoles", died: "78", succ: "Humberto II", facts: {es:["Rey durante las dos Guerras Mundiales", "Permitió el ascenso de Mussolini (Fascismo)", "Abdicó para salvar la monarquía"], en:["King during both World Wars", "Allowed Mussolini's rise", "Abdicated to save monarchy"]} },
            { type: 'king', n: "Humberto II", y: "1946", d: "Saboya", c: "d-green", i: "cross", born: "Racconigi", died: "78", succ: "República", facts: {es:["El Rey de Mayo (reinó 34 días)", "Referéndum abolió la monarquía", "Exiliado en Portugal"], en:["The May King (reigned 34 days)", "Referendum abolished monarchy", "Exiled in Portugal"]} },

            // REPÚBLICA
            { type: 'gap', title: {es:"República Italiana", en:"Italian Republic"}, desc: {es:"1946-Presente (Democracia Parlamentaria)", en:"1946-Present (Parliamentary Democracy)"}, y:"1946-Pte" }
        ];

        function getSVG(t) {
            const c = {r:"#e74c3c", b:"#2980b9", w:"#ffffff", k:"#2c3e50"};
            const shield = 'd="M20 10 h60 v50 a30 30 0 0 1 -60 0 z"';
            let p = '';
            
            // Escudo Saboya (Cruz blanca sobre fondo rojo)
            // Nota: En la bandera italiana monárquica, el escudo tiene borde azul.
            if(t==='cross') p=`<path ${shield} fill="${c.r}" stroke="${c.k}"/><path d="M50 10 v50 M20 35 h60" stroke="${c.w}" stroke-width="10"/> <path ${shield} fill="none" stroke="${c.b}" stroke-width="2"/>`; 
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const labels = { es: { born:"Nace", died:"Muere", succ:"Sucesor" }, en: { born:"Born", died:"Died", succ:"Successor" } }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `<div class="gap-title">${item.title[lang]}</div><div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>${getSVG('gap')}<div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>`;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `<div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div><div class="card-header"><div class="monarch-name">${item.n}</div>${getSVG(item.i)}</div><div class="years">${item.y}</div><div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div><div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div><div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div><div class="events-box"><ul class="events-list">${facts}</ul></div>`;
                }
                container.appendChild(card);
            });
        }
        renderTimeline();
    </script>
</body>
</html>
