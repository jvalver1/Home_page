<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyes de Grecia - Monarchia</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="nav-btn"><span>⬅</span> Menú</a>
        <div class="app-title">GRECIA</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Monarquía Helénica</h1>
            <p id="pageSub">El Reino de Grecia (1832-1973)</p>
        </div>
        <div class="timeline-container" id="timeline"></div>
    </div>

    <script>
        const DB = [
            // INDEPENDENCIA
            { type: 'gap', title: {es:"Guerra de Independencia", en:"War of Independence"}, desc: {es:"1821-1832 (Fin del dominio Otomano)", en:"1821-1832 (End of Ottoman rule)"}, y:"1821-1832" },

            // WITTELSBACH
            { type: 'king', n: "Otón I", y: "1832-1862", d: "Wittelsbach", c: "d-blue", i: "shield", born: "Salzburgo", died: "52", succ: "Jorge I", facts: {es:["Primer Rey de Grecia moderna", "Príncipe bávaro elegido por potencias", "Expulsado por golpe militar"], en:["First King of modern Greece", "Bavarian prince elected by powers", "Expelled by military coup"]} },

            // GLÜCKSBURG
            { type: 'king', n: "Jorge I", y: "1863-1913", d: "Glücksburg", c: "d-blue", i: "shield", born: "Copenhague", died: "67", succ: "Constantino I", facts: {es:["Príncipe danés", "Reinado de 50 años", "Juegos Olímpicos 1896", "Asesinado en Tesalónica"], en:["Danish prince", "50-year reign", "1896 Olympics", "Assassinated in Thessaloniki"]} },
            { type: 'king', n: "Constantino I", y: "1913-1917", d: "Glücksburg", c: "d-blue", i: "shield", born: "Atenas", died: "54", succ: "Alejandro I", facts: {es:["Cisma Nacional (I Guerra Mundial)", "Abdicó por presión aliada"], en:["National Schism (WWI)", "Abdicated under Allied pressure"]} },
            { type: 'king', n: "Alejandro I", y: "1917-1920", d: "Glücksburg", c: "d-blue", i: "shield", born: "Atenas", died: "27", succ: "Constantino I", facts: {es:["Rey títere durante la guerra", "Murió por mordedura de mono"], en:["Puppet king during war", "Died from monkey bite"]} },
            { type: 'king', n: "Constantino I (Restaurado)", y: "1920-1922", d: "Glücksburg", c: "d-blue", i: "shield", born: "Atenas", died: "54", succ: "Jorge II", facts: {es:["Regreso al trono", "Desastre de Asia Menor (Guerra Greco-Turca)"], en:["Return to throne", "Asia Minor Disaster (Greco-Turkish War)"]} },
            
            // II REPÚBLICA
            { type: 'gap', title: {es:"II República Helénica", en:"Second Hellenic Republic"}, desc: {es:"1924-1935 (Abolición temporal)", en:"1924-1935 (Temporary abolition)"}, y:"1924-1935" },

            // RESTAURACIÓN
            { type: 'king', n: "Jorge II", y: "1935-1947", d: "Glücksburg", c: "d-blue", i: "shield", born: "Tatoi", died: "56", succ: "Pablo I", facts: {es:["Restaurado tras plebiscito", "Dictadura de Metaxas", "Exilio durante II Guerra Mundial"], en:["Restored after plebiscite", "Metaxas Dictatorship", "Exile during WWII"]} },
            { type: 'king', n: "Pablo I", y: "1947-1964", d: "Glücksburg", c: "d-blue", i: "shield", born: "Atenas", died: "62", succ: "Constantino II", facts: {es:["Guerra Civil Griega", "Reconstrucción económica", "Padre de la Reina Sofía de España"], en:["Greek Civil War", "Economic reconstruction", "Father of Queen Sofia of Spain"]} },
            { type: 'king', n: "Constantino II", y: "1964-1973", d: "Glücksburg", c: "d-blue", i: "shield", born: "Atenas", died: "82", succ: "República", facts: {es:["Último Rey de Grecia", "Medalla de Oro Olímpica (Vela)", "Golpe de los Coroneles", "Exilio en Londres"], en:["Last King of Greece", "Olympic Gold Medal (Sailing)", "Junta of the Colonels", "Exile in London"]} },

            // REPÚBLICA ACTUAL
            { type: 'gap', title: {es:"III República Helénica", en:"Third Hellenic Republic"}, desc: {es:"1974-Presente (Referéndum)", en:"1974-Present (Referendum)"}, y:"1974-Pte" }
        ];

        function getSVG(t) {
            const c = {b:"#0d5eaf", w:"#fff"};
            let p = '';
            // Escudo Cruz Griega
            if(t==='shield') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.b}" stroke="#333"/><path d="M50 10 v50 M20 35 h60" stroke="${c.w}" stroke-width="8"/>`;
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const labels = { es: { born:"Nace", died:"Muere", succ:"Sucesor" }, en: { born:"Born", died:"Died", succ:"Successor" } }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `<div class="gap-title">${item.title[lang]}</div><div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>${getSVG('gap')}<div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>`;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `<div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div><div class="card-header"><div class="monarch-name">${item.n}</div>${getSVG(item.i)}</div><div class="years">${item.y}</div><div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div><div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div><div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div><div class="events-box"><ul class="events-list">${facts}</ul></div>`;
                }
                container.appendChild(card);
            });
        }
        renderTimeline();
    </script>
</body>
</html>
