<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyes de Noruega - Monarchia</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="nav-btn"><span>⬅</span> Menú</a>
        <div class="app-title">NORUEGA</div>
        <select id="langSelect" onchange="renderTimeline()" style="padding:5px; border-radius:5px;">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="pageTitle">Monarquía Noruega</h1>
            <p id="pageSub">De los Vikingos a la Independencia</p>
        </div>
        <div class="timeline-container" id="timeline"></div>
    </div>

    <script>
        const DB = [
            // EDAD VIKINGA
            { type: 'king', n: "Harald I (Cabellera Hermosa)", y: "872-932", d: "Hårfagre", c: "d-red", i: "axe", born: "Vestfold", died: "82", succ: "Erico I", facts: {es:["Unificador de Noruega", "Juró no cortarse el pelo hasta unir el reino"], en:["Unifier of Norway", "Vowed not to cut hair until unification"]} },
            { type: 'king', n: "Olav II (San Olav)", y: "1015-1028", d: "Hårfagre", c: "d-red", i: "axe", born: "Ringerike", died: "35", succ: "Cnut", facts: {es:["Santo Patrón de Noruega", "Cristianizó el país", "Murió en la batalla de Stiklestad"], en:["Patron Saint of Norway", "Christianized country", "Died at Stiklestad"]} },
            { type: 'king', n: "Haakon IV", y: "1217-1263", d: "Sverre", c: "d-red", i: "axe", born: "Østfold", died: "59", succ: "Magnus VI", facts: {es:["Era dorada medieval", "Dominio sobre Islandia y Groenlandia", "Paz civil tras guerras"], en:["Medieval Golden Age", "Ruled Iceland/Greenland", "Civil peace"]} },

            // UNIONES
            { type: 'gap', title: {es:"Unión de Kalmar / Dano-Noruega", en:"Kalmar / Dano-Norwegian Union"}, desc: {es:"1380-1814 (Bajo reyes daneses)", en:"1380-1814 (Under Danish kings)"}, y:"1380-1814" },
            { type: 'gap', title: {es:"Unión con Suecia", en:"Union with Sweden"}, desc: {es:"1814-1905 (Bajo reyes suecos)", en:"1814-1905 (Under Swedish kings)"}, y:"1814-1905" },

            // GLÜCKSBURG (Independencia)
            { type: 'king', n: "Haakon VII", y: "1905-1957", d: "Glücksburg", c: "d-blue", i: "axe", born: "Dinamarca", died: "85", succ: "Olav V", facts: {es:["Príncipe danés (Carl) elegido rey", "Dijo 'No' a los nazis en la invasión", "Símbolo de la resistencia"], en:["Elected king", "Said 'No' to Nazis", "Resistance symbol"]} },
            { type: 'king', n: "Olav V", y: "1957-1991", d: "Glücksburg", c: "d-blue", i: "axe", born: "UK", died: "87", succ: "Harald V", facts: {es:["El Rey del Pueblo", "Atleta olímpico (Vela)", "Pagaba su billete en el tranvía"], en:["The People's King", "Olympic athlete", "Paid his tram ticket"]} },
            { type: 'king', n: "Harald V", y: "1991-Pte", d: "Glücksburg", c: "d-blue", i: "axe", born: "Asker", died: "-", succ: "Haakon", facts: {es:["Rey actual", "Primer rey nacido en Noruega en 567 años", "Modernización social"], en:["Current King", "First native-born in 567 years", "Social modernization"]} }
        ];

        function getSVG(t) {
            const c = {r:"#ba0c2f", y:"#ffc62f", k:"#2c3e50"};
            let p = '';
            // León con hacha (Escudo noruego)
            if(t==='axe') p=`<path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z" fill="${c.r}" stroke="${c.k}"/><path d="M40 25 h20 v30 h-20 z" fill="${c.y}"/> <path d="M60 25 l10 -10 l-10 10" stroke="${c.y}" stroke-width="3"/>`;
            if(t==='gap') p=`<circle cx="50" cy="50" r="25" fill="#ccc"/><text x="50" y="60" font-size="30" text-anchor="middle" fill="white">?</text>`;
            return `<svg viewBox="0 0 100 100" style="width:40px;height:40px;">${p}</svg>`;
        }

        function renderTimeline() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            const labels = { es: { born:"Nace", died:"Muere", succ:"Sucesor" }, en: { born:"Born", died:"Died", succ:"Successor" } }[lang];

            DB.forEach(item => {
                const card = document.createElement('div');
                if (item.type === 'gap') {
                    card.className = 'gap-card';
                    card.innerHTML = `<div class="gap-title">${item.title[lang]}</div><div style="font-weight:bold; font-size:1.2em; color:#e74c3c;">${item.y}</div>${getSVG('gap')}<div class="gap-desc" style="margin-top:10px">${item.desc[lang]}</div>`;
                } else {
                    card.className = `monarch-card ${item.c}`;
                    const facts = item.facts[lang].map(f => `<li>${f}</li>`).join('');
                    card.innerHTML = `<div class="dynasty-badge ${item.c.replace('d-', 'bg-')}">${item.d}</div><div class="card-header"><div class="monarch-name">${item.n}</div>${getSVG(item.i)}</div><div class="years">${item.y}</div><div class="detail-row"><span class="label">${labels.born}:</span> ${item.born}</div><div class="detail-row"><span class="label">${labels.died}:</span> ${item.died}</div><div class="detail-row"><span class="label">${labels.succ}:</span> ${item.succ}</div><div class="events-box"><ul class="events-list">${facts}</ul></div>`;
                }
                container.appendChild(card);
            });
        }
        renderTimeline();
    </script>
</body>
</html>
