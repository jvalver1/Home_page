<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    canvas {
      display: block;
      background-color: #333;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<audio id="eatSound"><source src="https://freesound.org/data/previews/291/291786_3lc835.mp3" type="audio/wav"></audio>
<audio id="gameOverSound"><source src="https://freesound.org/data/previews/406/406715_4lq7xg.mp3" type="audio/wav"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let snake = [{ x: 150, y: 150 }];
let food = { x: Math.floor(Math.random() * (canvas.width / 10)) * 10, y: Math.floor(Math.random() * (canvas.height / 10)) * 10 };
let dx = 0;
let dy = -10;

let score = 0;
const eatSound = document.getElementById('eatSound');
const gameOverSound = document.getElementById('gameOverSound');

document.addEventListener("keydown", (event) => {
  if (event.key === 'ArrowUp' && dx !== 0) { dx = 0; dy = -10; }
  else if (event.key === 'ArrowDown' && dx !== 0) { dx = 0; dy = 10; }
  else if (event.key === 'ArrowLeft' && dy !== 0) { dx = -10; dy = 0; }
  else if (event.key === 'ArrowRight' && dy !== 0) { dx = 10; dy = 0; }
});

function drawSnake() {
  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? '#fff' : '#696';
    ctx.fillRect(part.x, part.y, 10, 10);
  });
}

function drawFood() {
  ctx.fillStyle = 'red';
  ctx.fillRect(food.x, food.y, 10, 10);
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    eatSound.play();
    score += 10;
    food = { x: Math.floor(Math.random() * (canvas.width / 10)) * 10, y: Math.floor(Math.random() * (canvas.height / 10)) * 10 };
  } else if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
    gameOverSound.play();
    alert(`Game Over! Your score is ${score}`);
    location.reload();
  } else {
    snake.pop();
  }

  drawSnake();
  drawFood();

  setTimeout(gameLoop, 150);
}

gameLoop();
</script>

</body>
</html>
