<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Snake | Premium Game Experience</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game-container">
      <header>
        <h1>NEON<span>SNAKE</span></h1>
        <div class="score-board">
          <div class="score-item">
            <span class="label">SCORE</span>
            <span id="score" class="value">000</span>
          </div>
          <div class="score-item">
            <span class="label">HIGH SCORE</span>
            <span id="highScore" class="value">000</span>
          </div>
        </div>
      </header>

      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-content">
            <h2 id="overlay-title">GAME OVER</h2>
            <p id="overlay-msg">Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">PLAY AGAIN</button>
          </div>
        </div>
      </div>

      <footer>
        <div class="controls-hint">
          <p>Use <b>CURSORS</b> to move the snake</p>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
