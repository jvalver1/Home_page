<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jungle Slither - Realistic Snake Game" />
  <title>Jungle Slither</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Lilita+One&family=Righteous&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="jungle-container">
    <header class="game-header">
      <h1 class="game-title">
        <span class="title-jungle">JUNGLE</span><br>
        <span class="title-slither">SLITHER</span>
      </h1>
      <nav class="top-nav">
        <a href="#" class="nav-link">PLAY</a> |
        <a href="#" class="nav-link">LEADERBOARD</a> |
        <a href="#" class="nav-link">CONTROLS</a> |
        <a href="#" class="nav-link">QUIT</a>
      </nav>
    </header>

    <div class="game-wrapper">
      <div class="stats-banner">
        <div class="stat-box">
          <span class="stat-label">SCORE:</span>
          <span class="stat-value" id="score">000,000</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">HIGH SCORE:</span>
          <span class="stat-value" id="highScore">000,000</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">LEVEL:</span>
          <span class="stat-value" id="level">1</span>
        </div>
        <div class="stat-box lives-box">
          <span class="stat-label">LIVES:</span>
          <div class="lives-container" id="lives">
            <span class="heart">💚</span>
            <span class="heart">💚</span>
            <span class="heart">💚</span>
          </div>
        </div>
        <div class="stat-box pause-box">
          <span class="stat-label">PAUSE</span>
          <button id="pauseButton" class="pause-btn">⏸</button>
        </div>
      </div>

      <div class="main-content-area">
        <div class="canvas-container">
          <canvas id="gameCanvas" width="800" height="520"></canvas>

          <!-- Start Screen -->
          <div class="overlay" id="startScreen">
            <div class="overlay-content">
              <h2 class="overlay-title">Ready to Slither?</h2>
              <button class="game-button" id="startButton">LOADING...</button>
            </div>
          </div>

          <!-- Game Over Screen -->
          <div class="overlay hidden" id="gameOverScreen">
            <div class="overlay-content">
              <h2 class="overlay-title game-over">GAME OVER</h2>
              <p class="final-score">Score: <span id="finalScore">0</span></p>
              <button class="game-button" id="restartButton">PLAY AGAIN</button>
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div class="sidebar-section">
            <h3 class="sidebar-title">JUNGLE<br>GUIDES</h3>
            <p class="sidebar-text">LEVELS:<br>1<br>to<br>10</p>
          </div>

          <div class="sidebar-section">
            <h3 class="sidebar-title">UPGRADES</h3>
            <p class="sidebar-text">Speed Boost<br>Life</p>
          </div>

          <div class="sidebar-section">
            <h3 class="sidebar-title">SOUND</h3>
            <button class="sound-toggle" id="soundToggle">🔊</button>
          </div>

          <div class="sidebar-section">
            <h3 class="sidebar-title">SETTINGS</h3>
            <button class="settings-btn" id="settingsButton">⚙️</button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>

</html>
