<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #gameCanvas {
      background-color: #eee;
      border: 2px solid #333;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Constants
    const gridSize = 20;
    const gameSpeed = 150; // milliseconds
    const initialSnakeLength = 3;
    const backgroundColor = '#eee';
    const snakeColor = '#33a846';  // Green
    const foodColor = '#e91e63';  // Pink
    const textColor = '#333';

    // Initialize Game State
    let snake = [{ x: gridSize * 5, y: gridSize * 5 }];
    let food = { x: 0, y: 0 };
    let dx = 1; // 1 = right, -1 = left, 0 = stationary (along x)
    let dy = 0; // 1 = down, -1 = up, 0 = stationary (along y)
    let score = 0;
    let gameOver = false;

    // Sound Effects (using Web Audio API)
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(frequency, duration) {
      const oscillator = audioContext.createOscillator();
      oscillator.type = 'sine';  // or 'square', 'sawtooth', 'triangle'
      oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
      oscillator.connect(audioContext.destination);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration / 1000);
    }

    //Generate Food
    function generateFood() {
        food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
        food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
    }

    // Initialize Food
    generateFood();

    // Game Loop
    function gameLoop() {
      if (gameOver) return;

      // Update Game State
      update();

      // Draw Game
      draw();

      // Call gameLoop again
      setTimeout(gameLoop, gameSpeed);
    }


    function update() {
        const head = { x: snake[0].x + dx * gridSize, y: snake[0].y + dy * gridSize };

        //Collision Detection
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || checkCollision(head, snake)) {
            gameOver = true;
            playSound(220, 200); // Game Over sound
            return;
        }

        snake.unshift(head);

        // Check if snake ate food
        if (head.x === food.x && head.y === food.y) {
            score++;
            playSound(440, 100); // Food eaten sound
            generateFood();
        } else {
            snake.pop(); // Remove tail if no food was eaten
        }
    }

    function checkCollision(head, snakeBody) {
      for (let i = 0; i < snakeBody.length; i++) {
        if (head.x === snakeBody[i].x && head.y === snakeBody[i].y) {
          return true;
        }
      }
      return false;
    }

    function draw() {
      // Clear the canvas
      ctx.fillStyle = backgroundColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Snake
      ctx.fillStyle = snakeColor;
      for (let i = 0; i < snake.length; i++) {
        ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
      }

      // Draw Food
      ctx.fillStyle = foodColor;
      ctx.fillRect(food.x, food.y, gridSize, gridSize);

      // Draw Score
      ctx.fillStyle = textColor;
      ctx.font = '16px Arial';
      ctx.fillText('Score: ' + score, 10, 20);

      // Draw Game Over Message
      if (gameOver) {
        ctx.fillStyle = textColor;
        ctx.font = '32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
      }
    }

    // Event Listeners
    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowRight' && dx !== -1) {
        dx = 1;
        dy = 0;
      } else if (event.key === 'ArrowLeft' && dx !== 1) {
        dx = -1;
        dy = 0;
      } else if (event.key === 'ArrowUp' && dy !== 1) {
        dx = 0;
        dy = -1;
      } else if (event.key === 'ArrowDown' && dy !== -1) {
        dx = 0;
        dy = 1;
      }
    });

    // Start the game
    gameLoop();
  </script>

</body>
</html>
