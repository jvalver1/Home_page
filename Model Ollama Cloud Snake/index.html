<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .game-container {
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 25px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 2.8rem;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(30, 30, 30, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
        
        .score-container, .high-score-container {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .score-value, .high-score-value {
            color: #FFD700;
            font-size: 1.4rem;
        }
        
        .game-board {
            position: relative;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 5px;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }
        
        canvas {
            display: block;
            margin: 0 auto;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        
        button {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            background: linear-gradient(to bottom, #66BB6A, #388E3C);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background: rgba(30, 30, 30, 0.7);
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            color: #ddd;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .instructions h2 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        
        .key {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 3px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin: 0 3px;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            display: none;
        }
        
        .final-score {
            color: #FFD700;
            margin: 20px 0;
            font-size: 2.5rem;
        }
        
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .mobile-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }
        
        @media (max-width: 600px) {
            .mobile-controls {
                display: grid;
            }
            
            .game-container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 SNAKE GAME</h1>
        
        <div class="game-info">
            <div class="score-container">
                SCORE: <span class="score-value">0</span>
            </div>
            <div class="high-score-container">
                HIGH SCORE: <span class="high-score-value">0</span>
            </div>
        </div>
        
        <div class="game-board">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over">
                <div>GAME OVER!</div>
                <div class="final-score">Score: 0</div>
                <button id="restartButton">PLAY AGAIN</button>
            </div>
        </div>
        
        <div class="controls">
            <button id="startButton">START GAME</button>
            <button id="pauseButton">PAUSE</button>
        </div>
        
        <div class="mobile-controls">
            <button class="mobile-btn up">↑</button>
            <button class="mobile-btn left">←</button>
            <button class="mobile-btn right">→</button>
            <button class="mobile-btn down">↓</button>
        </div>
        
        <div class="instructions">
            <h2>HOW TO PLAY</h2>
            <p>Use the <span class="key">←</span> <span class="key">↑</span> <span class="key">→</span> <span class="key">↓</span> arrow keys to control the snake.</p>
            <p>Eat the <span style="color:#FF5252;">●</span> food to grow and earn points.</p>
            <p>Avoid hitting the walls or yourself!</p>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreValue = document.querySelector('.score-value');
        const highScoreValue = document.querySelector('.high-score-value');
        const finalScore = document.querySelector('.final-score');
        const gameOverScreen = document.querySelector('.game-over');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const restartButton = document.getElementById('restartButton');
        
        // Mobile controls
        const upBtn = document.querySelector('.up');
        const leftBtn = document.querySelector('.left');
        const rightBtn = document.querySelector('.right');
        const downBtn = document.querySelector('.down');
        
        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let speed = 120; // milliseconds between updates
        
        // Initialize high score display
        highScoreValue.textContent = highScore;
        
        // Initialize game
        function initGame() {
            // Initial snake position (centered)
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            
            // Initial direction (moving right)
            dx = 1;
            dy = 0;
            
            // Generate first food
            generateFood();
            
            // Reset score
            score = 0;
            scoreValue.textContent = score;
            
            // Hide game over screen
            gameOverScreen.style.display = 'none';
        }
        
        // Generate food at random position
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            // Make sure food doesn't appear on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }
        
        // Draw game elements
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Draw head with different color
                    ctx.fillStyle = '#4CAF50';
                } else {
                    // Draw body with gradient
                    const gradient = ctx.createLinearGradient(
                        segment.x * gridSize, 
                        segment.y * gridSize, 
                        segment.x * gridSize + gridSize, 
                        segment.y * gridSize + gridSize
                    );
                    gradient.addColorStop(0, '#2E7D32');
                    gradient.addColorStop(1, '#4CAF50');
                    ctx.fillStyle = gradient;
                }
                
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
                
                // Add eyes to head
                if (index === 0) {
                    ctx.fillStyle = '#000';
                    // Position eyes based on direction
                    if (dx === 1) { // Right
                        ctx.fillRect((segment.x + 0.7) * gridSize, (segment.y + 0.2) * gridSize, 3, 3);
                        ctx.fillRect((segment.x + 0.7) * gridSize, (segment.y + 0.7) * gridSize, 3, 3);
                    } else if (dx === -1) { // Left
                        ctx.fillRect((segment.x + 0.2) * gridSize, (segment.y + 0.2) * gridSize, 3, 3);
                        ctx.fillRect((segment.x + 0.2) * gridSize, (segment.y + 0.7) * gridSize, 3, 3);
                    } else if (dy === -1) { // Up
                        ctx.fillRect((segment.x + 0.2) * gridSize, (segment.y + 0.2) * gridSize, 3, 3);
                        ctx.fillRect((segment.x + 0.7) * gridSize, (segment.y + 0.2) * gridSize, 3, 3);
                    } else if (dy === 1) { // Down
                        ctx.fillRect((segment.x + 0.2) * gridSize, (segment.y + 0.7) * gridSize, 3, 3);
                        ctx.fillRect((segment.x + 0.7) * gridSize, (segment.y + 0.7) * gridSize, 3, 3);
                    }
                }
            });
            
            // Draw food
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2,
                food.y * gridSize + gridSize/2,
                gridSize/2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Add shine effect to food
            ctx.fillStyle = '#FF9A9A';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/3,
                food.y * gridSize + gridSize/3,
                gridSize/6,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // Update game state
        function update() {
            if (gamePaused || !gameRunning) return;
            
            // Move snake
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Check collision with walls - FIXED BOUNDARIES
            // The valid positions are from 0 to tileCount-1 inclusive
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // Check collision with self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check if food is eaten
            if (head.x === food.x && head.y === food.y) {
                // Increase score
                score += 10;
                scoreValue.textContent = score;
                
                // Generate new food
                generateFood();
                
                // Increase speed slightly
                if (speed > 70) {
                    speed -= 2;
                }
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            
            if (gameRunning && !gamePaused) {
                setTimeout(gameLoop, speed);
            }
        }
        
        // Handle keyboard input
        function handleKeydown(e) {
            // Prevent default behavior for arrow keys
            if ([37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // Pause/resume with spacebar
            if (e.keyCode === 32) {
                togglePause();
                return;
            }
            
            // Change direction (prevent 180-degree turns)
            switch(e.keyCode) {
                case 37: // Left arrow
                    if (dx === 0) {
                        dx = -1;
                        dy = 0;
                    }
                    break;
                case 38: // Up arrow
                    if (dy === 0) {
                        dx = 0;
                        dy = -1;
                    }
                    break;
                case 39: // Right arrow
                    if (dx === 0) {
                        dx = 1;
                        dy = 0;
                    }
                    break;
                case 40: // Down arrow
                    if (dy === 0) {
                        dx = 0;
                        dy = 1;
                    }
                    break;
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            
            // Update high score if needed
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreValue.textContent = highScore;
            }
            
            // Show game over screen
            finalScore.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Toggle pause state
        function togglePause() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            pauseButton.textContent = gamePaused ? 'RESUME' : 'PAUSE';
            
            if (!gamePaused) {
                gameLoop();
            }
        }
        
        // Start game
        function startGame() {
            if (gameRunning) return;
            
            initGame();
            gameRunning = true;
            gamePaused = false;
            pauseButton.textContent = 'PAUSE';
            gameLoop();
        }
        
        // Event listeners
        document.addEventListener('keydown', handleKeydown);
        startButton.addEventListener('click', startGame);
        pauseButton.addEventListener('click', togglePause);
        restartButton.addEventListener('click', startGame);
        
        // Mobile controls
        upBtn.addEventListener('click', () => { if (dy === 0) { dx = 0; dy = -1; } });
        leftBtn.addEventListener('click', () => { if (dx === 0) { dx = -1; dy = 0; } });
        rightBtn.addEventListener('click', () => { if (dx === 0) { dx = 1; dy = 0; } });
        downBtn.addEventListener('click', () => { if (dy === 0) { dx = 0; dy = 1; } });
        
        // Initialize the game board
        initGame();
        draw();
    </script>
</body>
</html>
