<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AI Models Information - Montykona INC</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f49d25",
                        "background-light": "#fdf7f2",
                        "background-dark": "#0d0907",
                        "glass-panel": "rgba(255, 255, 255, 0.05)",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-mesh {
            background-color: #0d0907;
            background-image:
                radial-gradient(at 20% 0%, rgba(244, 157, 37, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 100%, rgba(239, 68, 68, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 50%, rgba(85, 54, 242, 0.1) 0px, transparent 50%);
        }

        .model-card {
            transition: all 0.3s ease;
        }

        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(244, 157, 37, 0.3);
            border-color: rgba(244, 157, 37, 0.5);
        }

        .badge-open {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-closed {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden min-h-screen">
    <div class="relative min-h-screen flex flex-col bg-mesh">
        <!-- Header -->
        <header class="sticky top-0 z-50 glass border-b border-white/5 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" title="Return Home"
                    class="w-10 h-10 rounded-full glass hover:bg-white/10 flex items-center justify-center transition-colors group">
                    <span
                        class="material-symbols-outlined text-slate-300 group-hover:text-primary transition-colors">arrow_back</span>
                </a>
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 rounded bg-primary flex items-center justify-center shadow-[0_0_15px_rgba(244,157,37,0.5)]">
                        <span class="material-symbols-outlined text-white text-xl">corporate_fare</span>
                    </div>
                    <h1 class="text-lg font-bold tracking-tight">Montykona INC</h1>
                </div>
            </div>
            <div class="text-right">
                <div id="datetime-display"
                    class="text-xs sm:text-sm font-medium text-slate-300 font-mono tracking-tight">
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-5xl mx-auto w-full px-6 pt-12 pb-32">
            <div class="text-center mb-16">
                <h2 class="text-4xl md:text-5xl font-bold leading-tight tracking-tighter mb-4 text-white">
                    Our AI Models <span class="text-primary">Ecosystem</span>
                </h2>
                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                    Powering the next generation of digital experiences. Here are the core intelligence engines that
                    drive our applications, ranging from proprietary frontier models to open-weight pioneers.
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="models-container">
                <!-- Models will be dynamically generated here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="glass border-t border-white/5 px-6 py-6 text-center mt-auto">
            <div class="text-xs text-slate-400 font-medium tracking-wide">
                &copy; <span id="current-year"></span> Montykona INC. All rights reserved.
            </div>
        </footer>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        const models = [
            {
                name: "Claude Sonnet (Anthropic)",
                creator: "Anthropic",
                isOpenSource: false,
                desc: "A highly capable and incredibly fast frontier model by Anthropic, balancing intelligence and speed flawlessly. Used extensively across our applications for robust reasoning.",
                link: "https://www.anthropic.com/claude"
            },
            {
                name: "Qwen Coder (Alibaba Cloud)",
                creator: "Alibaba Cloud",
                isOpenSource: true,
                desc: "A series of state-of-the-art open-source large language models optimized specifically for code generation, code reasoning, and debugging tasks.",
                link: "https://qwenlm.github.io/"
            },
            {
                name: "Mistral NeMo 12B",
                creator: "Mistral AI & NVIDIA",
                isOpenSource: true,
                desc: "A highly performant 12B parameter model built in collaboration with NVIDIA, boasting a massive 128k context window and excellent multilingual capabilities.",
                link: "https://mistral.ai/news/mistral-nemo/"
            },
            {
                name: "Gemma 27B",
                creator: "Google DeepMind",
                isOpenSource: true,
                desc: "A highly lightweight, state-of-the-art open model built from the same research and technology used to create the Gemini models.",
                link: "https://ai.google.dev/gemma"
            },
            {
                name: "Gemini Flash / Antigravity",
                creator: "Google DeepMind",
                isOpenSource: false,
                desc: "The lightweight, ultra-fast multimodal model from Google's Gemini family, designed specifically for rapid interactions and scalability.",
                link: "https://deepmind.google/technologies/gemini/"
            },
            {
                name: "GLM Series (Zhipu AI)",
                creator: "Zhipu AI",
                isOpenSource: true,
                desc: "A powerful bilingual (English/Chinese) conversational AI model series offering strong logical reasoning and generative capabilities.",
                link: "https://github.com/THUDM/GLM-4"
            }
        ];

        const container = document.getElementById('models-container');

        models.forEach(model => {
            const badgeClass = model.isOpenSource ? "badge-open" : "badge-closed";
            const badgeText = model.isOpenSource ? "Open Source" : "Proprietary";
            const icon = model.isOpenSource ? "code_blocks" : "lock";

            container.innerHTML += `
            <div class="model-card glass rounded-2xl p-6 flex flex-col h-full relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xl font-bold text-slate-100">${model.name}</h3>
                    <span class="${badgeClass} px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 shrink-0">
                        <span class="material-symbols-outlined text-[12px]">${icon}</span> ${badgeText}
                    </span>
                </div>
                <div class="text-sm text-slate-300 mb-4 bg-white/5 inline-block py-1 px-3 rounded text-primary font-medium w-fit">
                    Creator: ${model.creator}
                </div>
                <p class="text-slate-400 text-sm leading-relaxed flex-1 mb-6">
                    ${model.desc}
                </p>
                <a href="${model.link}" target="_blank" rel="noopener noreferrer" class="bg-white/10 hover:bg-white/20 text-white transition-colors px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 mt-auto w-fit">
                    View Documentation <span class="material-symbols-outlined text-sm">open_in_new</span>
                </a>
            </div>
            `;
        });

        // Add Date Time Logic
        function updateDateTime() {
            const now = new Date();
            const dateOpts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            const timeOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateStr = now.toLocaleDateString('en-US', dateOpts);
            const timeStr = now.toLocaleTimeString('en-US', timeOpts);
            const el = document.getElementById('datetime-display');
            if (el) el.textContent = `${dateStr}  •  ${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>

</html>
