<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
            border-radius: 4px;
        }

        canvas {
            background-color: #111;
            display: block;
            border: 2px solid #333;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        h1 {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 3rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            margin-top: 0;
        }

        /* Score Board Styling */
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
        }

        #high-score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #f05; /* Pink color for High Score */
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #f05;
            z-index: 10;
        }

        .overlay-text {
            color: white;
            font-size: 1.5rem;
            margin-top: 20px;
            animation: pulse 2s infinite;
            text-align: center;
        }

        .highlight {
            color: #0ff;
            font-weight: bold;
            font-size: 1.8rem;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <!-- Score Displays -->
        <div id="score-board">SCORE: 0</div>
        <div id="high-score-board">HIGH: 0</div>
        
        <div id="ui-layer">
            <h1>Neon Snake</h1>
            <div id="game-over" style="display:none; flex-direction:column; align-items:center;">
                <div class="overlay-text" style="color: #f05; font-size: 2.5rem; animation: none; text-shadow: 0 0 10px #f05;">GAME OVER</div>
                <div class="overlay-text">Press <span class="highlight">SPACE</span> to Restart</div>
            </div>
            <div id="start-screen">
                <div class="overlay-text">Press <span class="highlight">SPACE</span> to Start</div>
                <div class="overlay-text" style="font-size: 1rem; margin-top: 10px; opacity: 0.7;">Use Arrow Keys to Move</div>
            </div>
        </div>
    </div>

<script>
    // --- Configuration ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score-board');
    const highScoreElement = document.getElementById('high-score-board');
    const gameOverElement = document.getElementById('game-over');
    const startScreenElement = document.getElementById('start-screen');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let score = 0;
    let highScore = 0; // New variable for high score
    let gameRunning = false; 
    let isAlive = false;     
    
    // Snake properties
    let snake = [];
    let velocity = { x: 0, y: 0 };
    let nextVelocity = { x: 0, y: 0 };
    
    // Food properties
    let food = { x: 15, y: 15 };

    // Particles System
    let particles = [];

    // Audio Context
    let audioCtx = null;

    // --- Input Handling ---
    window.document.addEventListener('keydown', (e) => {
        // Initialize Audio on first interaction
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        // Handle Space Bar (Start / Restart)
        if (e.code === 'Space') {
            if (!gameRunning || !isAlive) {
                resetGame();
            }
            return; 
        }

        // Handle Arrow Keys (Movement)
        if (gameRunning && isAlive) {
            switch (e.key) {
                case 'ArrowUp':
                    if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
                    break;
            }
        }
    });

    // --- Game Logic ---
    function gameLoop() {
        if (!gameRunning) return;

        if (isAlive) {
            update();
        }
        
        draw();
        
        if (isAlive) {
            setTimeout(() => {
                requestAnimationFrame(gameLoop);
            }, 1000 / 15); 
        }
    }

    function update() {
        velocity.x = nextVelocity.x;
        velocity.y = nextVelocity.y;

        if (velocity.x === 0 && velocity.y === 0) return;

        let head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

        // Wall Collision
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver();
            return;
        }

        // Self Collision
        for (let part of snake) {
            if (part.x === head.x && part.y === head.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head); 

        // Food Collision
        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreElement.innerText = "SCORE: " + score;
            
            // Update High Score if current score beats it
            if (score > highScore) {
                highScore = score;
                highScoreElement.innerText = "HIGH: " + highScore;
            }

            spawnFood();
            createParticles(food.x * gridSize, food.y * gridSize, '#f05', 20);
            playSound('eat');
        } else {
            snake.pop(); 
        }
    }

    function draw() {
        // Clear screen with slight trail effect
        ctx.fillStyle = 'rgba(17, 17, 17, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= tileCount; i++) {
            ctx.beginPath();
            ctx.moveTo(i * gridSize, 0);
            ctx.lineTo(i * gridSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * gridSize);
            ctx.lineTo(canvas.width, i * gridSize);
            ctx.stroke();
        }

        // Draw Particles
        updateAndDrawParticles();

        // Draw Food
        ctx.fillStyle = '#f05'; 
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#f05";
        drawRoundedRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4, 5);
        ctx.shadowBlur = 0;

        // Draw Snake
        snake.forEach((part, index) => {
            const hue = 180 - (index * 2); 
            ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
            ctx.shadowBlur = 15;
            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
            
            if (index === 0) {
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#0ff';
                drawRoundedRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize, 6);
                
                // Eyes
                ctx.fillStyle = '#000';
                let ex1, ey1, ex2, ey2;
                
                ex1 = part.x * gridSize + gridSize - 6; 
                ey1 = part.y * gridSize + 5;
                ex2 = part.x * gridSize + gridSize - 6; 
                ey2 = part.y * gridSize + gridSize - 8;

                if (velocity.x === -1) { 
                    ex1 = part.x * gridSize + 4; ex2 = part.x * gridSize + 4;
                } else if (velocity.y === -1) { 
                    ex1 = part.x * gridSize + 5; ey1 = part.y * gridSize + 4;
                    ex2 = part.x * gridSize + gridSize - 8; ey2 = part.y * gridSize + 4;
                } else if (velocity.y === 1) { 
                    ex1 = part.x * gridSize + 5; ey1 = part.y * gridSize + gridSize - 6;
                    ex2 = part.x * gridSize + gridSize - 8; ey2 = part.y * gridSize + gridSize - 6;
                }

                ctx.beginPath();
                ctx.arc(ex1, ey1, 3, 0, Math.PI*2);
                ctx.arc(ex2, ey2, 3, 0, Math.PI*2);
                ctx.fill();

            } else {
                drawRoundedRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
            }
            ctx.shadowBlur = 0;
        });
    }

    function drawRoundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) spawnFood();
        }
    }

    function gameOver() {
        isAlive = false;
        gameOverElement.style.display = 'flex';
        playSound('die');
        createParticles(snake[0].x * gridSize, snake[0].y * gridSize, '#fff', 50);
        startScreenElement.style.display = 'none';
    }

    function resetGame() {
        snake = [{ x: 10, y: 10 }];
        velocity = { x: 1, y: 0 }; 
        nextVelocity = { x: 1, y: 0 };
        score = 0;
        scoreElement.innerText = "SCORE: 0";
        
        isAlive = true;
        gameRunning = true;
        
        gameOverElement.style.display = 'none';
        startScreenElement.style.display = 'none';
        
        spawnFood();
        gameLoop();
    }

    // --- Particle System ---
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 5 + 2;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 4 - 2;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= this.decay;
            this.size *= 0.95;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x + gridSize/2, y + gridSize/2, color));
        }
    }

    function updateAndDrawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    // --- Sound System (Web Audio API) ---
    function playSound(type) {
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'eat') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    // --- Initial Setup ---
    function init() {
        snake = [{ x: 10, y: 10 }];
        spawnFood();
        draw(); 
    }

    init();

</script>
</body>
</html>
